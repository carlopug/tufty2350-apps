; Presentator dongle: ESP32-S3 inserito nel PC, si collega via BLE al badge
; Tufty 2350 (app apps/presentator) e preme i tasti come una tastiera USB
; standard. Nessun driver o software da installare su Windows.
;
;   pio run -e supermini -t upload     (ESP32-S3 Supermini)
;   pio run -e xiao -t upload          (Seeed XIAO ESP32S3 / Sense)
;
; Primo caricamento: tenere premuto BOOT, collegare l'USB, rilasciare BOOT
; (con USB in modalita' OTG la porta seriale cambia dopo il primo flash).

[platformio]
default_envs = supermini, xiao
; Optional local settings (ignored by git), e.g. a build_dir outside a
; synced folder such as Dropbox. See platformio_local.example.ini.
extra_configs = platformio_local.ini

[env]
platform = espressif32
framework = arduino
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0
monitor_speed = 115200
; Con USB in OTG l'esptool non puo' resettare la scheda via USB-JTAG:
; dal secondo caricamento in poi PlatformIO apre la porta CDC a 1200 baud
; (il core riavvia nel bootloader) e attende la nuova porta.
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
; USB nativa in modalita' OTG (TinyUSB): serve per la tastiera HID.
; CDC resta attivo per i log di debug (driver usbser integrato in Windows).
; L'include di FS serve perche' la libreria USB del core 3.x compila anche
; USBHostMSC.cpp -> USBMSCFS.h -> FS.h, ma non dichiara FS come dipendenza:
; senza questo percorso la build fallisce con "FS.h: No such file".
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I"${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src"

[env:supermini]
; ESP32-S3FH4R2: 4MB flash. LED RGB WS2812 su GPIO48 nella maggior parte
; delle varianti (se la tua non lo ha, il pin resta semplicemente inutilizzato).
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
    ${env.build_flags}
    -DSTATUS_RGB_PIN=48

[env:xiao]
; LED utente arancione su GPIO21, attivo basso (condiviso con CS microSD
; della scheda Sense: qui la microSD non si usa).
board = seeed_xiao_esp32s3
build_flags =
    ${env.build_flags}
    -DSTATUS_LED_PIN=21
    -DSTATUS_LED_ACTIVE_LOW=1
